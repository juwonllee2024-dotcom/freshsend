[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "freshsend"
version = "0.1.0"
description = "Stop sending yesterday's file: a safe local freshness check before AI chats and uploads."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "juwonllee2024-dotcom" }]
keywords = ["files", "freshness", "ai", "uploads", "cli", "privacy"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Utilities",
]

[project.scripts]
freshsend = "freshsend.cli:main"

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "mypy>=1.10",
  "pip-audit>=2.7",
  "pytest>=8.0",
  "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["freshsend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
